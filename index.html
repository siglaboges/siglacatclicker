<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sigla Cat Clicker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 id="title">Sigla Cat Clicker</h1>
  <div id="counter">0</div>
  <button id="cat" aria-label="Click the cat">
    <img src="cat.png" alt="Sigla cat" />
  </button>
  <div id="cps">0 clicks/sec</div>

  <button id="settings" aria-label="Settings">&#9881;</button>
  <div id="settings-panel">
    <div class="swatches">
      <button class="swatch" style="background:#b85c1f" data-color="#b85c1f" aria-label="orange"></button>
      <button class="swatch" style="background:#7d3bd6" data-color="#7d3bd6" aria-label="purple"></button>
      <button class="swatch" style="background:#2f8f4e" data-color="#2f8f4e" aria-label="green"></button>
      <button class="swatch" style="background:#2b6fb8" data-color="#2b6fb8" aria-label="blue"></button>
      <button class="swatch" style="background:#c0392b" data-color="#c0392b" aria-label="red"></button>
      <button class="swatch" style="background:#d14f9a" data-color="#d14f9a" aria-label="pink"></button>
    </div>
    <input type="color" id="color-input" value="#b85c1f" aria-label="Custom color" />
  </div>

  <button id="arrow" aria-label="Open upgrades">&#8593;</button>

  <button id="rebirth" aria-label="Rebirth">
    <span class="r-ico">&#8635;</span>
    <span class="r-cost" id="rebirth-cost">3K</span>
  </button>

  <div id="tree-overlay">
    <div id="tree-panel">
      <div id="tree-header">
        <span>Upgrade Tree</span>
        <button id="tree-close" aria-label="Close">&#10005;</button>
      </div>
      <div id="tree-stage">
        <span id="tree-hint">drag to move · scroll to zoom</span>
        <div id="tree-world">
          <svg id="tree-lines"></svg>
          <div id="tree-nodes"></div>
        </div>
      </div>
      <div id="tree-footer">Rebirth points: <span id="tree-points">0</span></div>
    </div>
  </div>

  <div id="menu">
    <h2>Upgrades</h2>
    <button class="upgrade" id="upgrade-claws" disabled>
      <span class="u-name">Sharp Claws</span>
      <span class="u-desc">+1 click per click</span>
      <span class="u-cost">Cost: 50</span>
    </button>
    <button class="upgrade" id="upgrade-petter" disabled>
      <span class="u-name">Auto-Petter</span>
      <span class="u-desc">+1 click per second</span>
      <span class="u-cost">Cost: 250</span>
    </button>
    <button class="upgrade" id="upgrade-megaclaw" disabled>
      <span class="u-name">Mega Claws</span>
      <span class="u-desc">+10 click per click</span>
      <span class="u-cost">Cost: 750</span>
    </button>
    <button class="upgrade" id="upgrade-superpetter" disabled>
      <span class="u-name">Super Petter</span>
      <span class="u-desc">+10 click per second</span>
      <span class="u-cost">Cost: 3750</span>
    </button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
